<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101014">
<title>KOMIK</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:#f4f2fa;font-family:Arial,sans-serif}
.app{max-width:480px;margin:auto;padding:20px 15px 90px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900;color:#b99cff}
h1{font-size:27px;margin:25px 0 5px}
p{color:#aaa5b7;font-size:13px}
input{width:100%;padding:15px;border-radius:15px;border:1px solid #444;background:#22222b;color:white;margin:18px 0}
button{border:0;padding:11px 15px;border-radius:20px;background:#8c6af2;color:white;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:18px}
.book{background:#1d1c25;padding:9px;border-radius:16px;overflow:hidden}
.book img{width:100%;height:190px;object-fit:cover;border-radius:11px;background:#302943}
.book b{display:block;margin:9px 0;font-size:14px}
.book small{color:#aaa5b7}
.page{display:none}.page.active{display:block}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:94%;max-width:450px;background:#25232e;border-radius:35px;padding:10px;display:flex;justify-content:space-around}
.nav button{background:transparent;color:#ddd}
.nav button.active{background:#805bea}
.item{padding:15px;background:#201e29;border-radius:13px;margin:9px 0}
.reader img{width:100%;display:block}
#status{color:#c5adff;margin:15px 0}
</style>
</head>
<body>
<main class="app">
<header><div class="logo">✦ KOMIK</div><span>📚</span></header>

<section id="home" class="page active">
<h1>Teroka Manga ✨</h1>
<p>Katalog manga dan manhwa daripada MangaDex</p>
<input id="query" placeholder="Cari tajuk manga / manhwa..." onkeydown="if(event.key==='Enter')search()">
<button onclick="search()">Cari komik</button>
<select id="category" onchange="search()" style="width:100%;padding:13px;border-radius:14px;background:#22222b;color:white;border:1px solid #444;margin-top:12px">
<option value="">Semua komik</option>
<option value="ja">🇯🇵 Manga</option>
<option value="ko">🇰🇷 Manhwa</option>
<option value="zh">🇨🇳 Manhua</option>
</select>
<div id="status">Memuatkan katalog...</div>
<div class="grid" id="books"></div>
<div id="catalogSentinel" style="text-align:center;padding:20px;color:#c5adff">Memuatkan lagi apabila scroll...</div>
</section>

<section id="details" class="page">
<button onclick="go('home')">← Kembali</button>
<div id="detail"></div>
<h2>Senarai Chapter</h2>
<div id="chapters"></div>
</section>

<section id="reader" class="page">
<button onclick="go('details')">← Kembali</button>
<h2 id="readerTitle">Pembaca KOMIK</h2>
<div id="readerPages" class="reader"></div>
</section>

<section id="saved" class="page">
<h1>Bookmark ♡</h1>
<div id="savedBooks"></div>
</section>
</main>

<nav class="nav">
<button class="active" onclick="go('home')">⌂ Utama</button>
<button onclick="go('saved')">♡ Simpan</button>
</nav>

<script>
const API='https://api.mangadex.org';
let currentManga=null;
let saved=JSON.parse(localStorage.getItem('mdsaved')||'[]');

function api(path){
 return new Promise((resolve,reject)=>{
  try{
   const result=MangaApi.get(path);
   const data=JSON.parse(result);
   if(data.error) reject(Error(data.error));
   else resolve(data);
  }catch(e){reject(e)}
 });
}

function go(id){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
 window.scrollTo(0,0);
 if(id==='saved')renderSaved();
}

function titleOf(m){
 const t=m.attributes.title||{};
 return t.en||Object.values(t)[0]||'Unknown title';
}

function coverOf(m){
 const rel=(m.relationships||[]).find(x=>x.type==='cover_art');
 if(!rel)return '';
 const file=rel.attributes?.fileName;
 return file?'https://uploads.mangadex.org/covers/'+m.id+'/'+file+'.256.jpg':'';
}

function originInfo(m){
 const lang=(m.attributes?.originalLanguage||'').toLowerCase();
 if(lang==='ja') return {flag:'🇯🇵',label:'MANGA',country:'Jepun'};
 if(lang==='ko') return {flag:'🇰🇷',label:'MANHWA',country:'Korea'};
 if(lang.startsWith('zh')) return {flag:'🇨🇳',label:'MANHUA',country:'China'};
 return {flag:'🌐',label:'TIDAK DIKETAHUI',country:'Asal tidak diketahui'};
}

function card(m){
 const name=titleOf(m);
 const img=coverOf(m);
 const origin=originInfo(m);
 return `<div class="book">
 <div style="display:inline-block;background:#eadcff;color:#6336a5;padding:5px 9px;border-radius:12px;font-size:12px;font-weight:bold;margin-bottom:6px">${origin.flag} ${origin.label}</div>
 <img src="${img}" loading="lazy" alt="Cover">
 <b>${escapeHtml(name)}</b>
 <small>${origin.country}</small>
 <p><button onclick="openManga('${m.id}')">Lihat chapter</button>
 <button onclick="bookmark('${m.id}')">♡</button></p>
 </div>`;
}

function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}


let mangaOffset = 0;
const mangaLimit = 100;
let mangaQuery = '';
let mangaTotal = 0;\nlet mangaLoading = false;\nlet chapterLoading = false;

async function search(){
 mangaQuery=document.getElementById('query').value.trim();
 mangaOffset=0;
 document.getElementById('books').innerHTML='';
 await loadManga(false);
}

async function loadMore(){
 await loadManga(true);
}

async function loadManga(append){
 if(mangaLoading) return;
 mangaLoading=true;

 const status=document.getElementById('status');
 const books=document.getElementById('books');
 const sentinel=document.getElementById('catalogSentinel');

 status.textContent='Sedang memuatkan komik...';
 sentinel.textContent='Memuatkan...';

 try{
  const category=document.getElementById('category').value;
  let lang='';
  if(category==='ja') lang='&originalLanguage[]=ja';
  if(category==='ko') lang='&originalLanguage[]=ko';
  if(category==='zh') lang='&originalLanguage[]=zh&originalLanguage[]=zh-hk&originalLanguage[]=zh-ro';

  const path='/manga?limit=100&offset='+mangaOffset+
   '&includes[]=cover_art&order[followedCount]=desc'+
   '&contentRating[]=safe&contentRating[]=suggestive'+
   lang+
   (mangaQuery?'&title='+encodeURIComponent(mangaQuery):'');

  const result=await api(path);
  const items=result.data||[];
  mangaTotal=result.total||0;

  if(!append) books.innerHTML='';

  if(items.length){
   books.insertAdjacentHTML('beforeend',items.map(card).join(''));
  }

  mangaOffset+=items.length;

  status.textContent='Ditemui '+books.querySelectorAll('.book').length+
   ' daripada '+mangaTotal+' tajuk';

  if(!items.length && !append){
   books.innerHTML='<p>Tiada tajuk ditemui.</p>';
  }

  if(mangaOffset>=mangaTotal || !items.length){
   sentinel.textContent='Semua tajuk yang tersedia telah dimuatkan.';
   sentinel.dataset.done='yes';
  }else{
   sentinel.textContent='Scroll ke bawah untuk memuatkan lagi komik';
   sentinel.dataset.done='no';
   if(catalogObserver) catalogObserver.observe(sentinel);
  }
 }catch(e){
  status.textContent='Gagal: '+e.message;
  sentinel.textContent='Gagal memuatkan. Scroll atau cuba cari semula.';
 }finally{
  mangaLoading=false;
 }
}

let chapterOffset = 0;
let chapterTotal = 0;

async function openManga(id){
 go('details');
 currentManga=id;
 chapterOffset=0;
 chapterTotal=0;
 document.getElementById('detail').innerHTML='<p>Memuatkan maklumat...</p>';
 document.getElementById('chapters').innerHTML='';
 try{
  const m=await api('/manga/'+id+'?includes[]=cover_art');
  const x=m.data;
  document.getElementById('detail').innerHTML=
   `<h1>${escapeHtml(titleOf(x))}</h1>
   <img style="width:145px;border-radius:12px" src="${coverOf(x)}">
   <p>${escapeHtml(x.attributes.description?.en||'Tiada sinopsis tersedia.')}</p>
   <button onclick="bookmark('${id}')">♡ Bookmark</button>`;
  await loadChapters(id,false);
 }catch(e){
  document.getElementById('detail').innerHTML='<p>Gagal memuatkan: '+escapeHtml(e.message)+'</p>';
 }
}

async function loadChapters(id,append=false){
 if(chapterLoading) return;
 chapterLoading=true;

 const el=document.getElementById('chapters');
 const oldSentinel=document.getElementById('chapterSentinel');
 if(oldSentinel) oldSentinel.remove();

 if(!append) el.innerHTML='<p>Memuatkan chapter...</p>';

 try{
  const path='/manga/'+id+'/feed?limit=100&offset='+chapterOffset+
   '&translatedLanguage[]=id&translatedLanguage[]=en&order[chapter]=desc';

  const feed=await api(path);
  if(id!==currentManga) return;

  const items=feed.data||[];
  chapterTotal=feed.total||0;

  if(!append) el.innerHTML='';

  const html=items.map(c=>
   `<div class="item">
   <b>Chapter ${escapeHtml(c.attributes.chapter||'?')}</b>
   <p>${escapeHtml(c.attributes.title||'')}</p>
   <button onclick="readChapter('${c.id}')">Baca</button>
   </div>`
  ).join('');

  el.insertAdjacentHTML('beforeend',html);
  chapterOffset+=items.length;

  if(!chapterOffset){
   el.innerHTML='<p>Belum ada chapter tersedia.</p>';
  }else if(chapterOffset<chapterTotal && items.length){
   el.insertAdjacentHTML('beforeend',
    '<div id="chapterSentinel" style="text-align:center;padding:20px;color:#c5adff">Scroll untuk memuatkan chapter seterusnya...</div>');
   if(chapterObserver) chapterObserver.observe(document.getElementById('chapterSentinel'));
  }else{
   el.insertAdjacentHTML('beforeend',
    '<p>Semua chapter yang tersedia telah dimuatkan.</p>');
  }
 }catch(e){
  el.insertAdjacentHTML('beforeend',
   '<p>Gagal memuatkan chapter: '+escapeHtml(e.message)+'</p>');
 }finally{
  chapterLoading=false;
 }
}

async function readChapter(id){
 go('reader');
 document.getElementById('readerPages').innerHTML='<p>Memuatkan halaman...</p>';
 try{
  const result=await api('/at-home/server/'+id);
  const ch=result.chapter;
  const files=ch.dataSaver?.length?ch.dataSaver:ch.data;
  const quality=ch.dataSaver?.length?'data-saver':'data';
  document.getElementById('readerPages').innerHTML=files.map(f=>
   `<img loading="lazy" src="${result.baseUrl}/${quality}/${ch.hash}/${encodeURIComponent(f)}">`
  ).join('');
 }catch(e){
  document.getElementById('readerPages').innerHTML='<p>Gagal memuatkan halaman: '+escapeHtml(e.message)+'</p>';
 }
}

function bookmark(id){
 saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];
 localStorage.setItem('mdsaved',JSON.stringify(saved));
 alert('Bookmark dikemaskini');
}

async function renderSaved(){
 const el=document.getElementById('savedBooks');
 el.innerHTML='<p>Memuatkan bookmark...</p>';
 if(!saved.length){el.innerHTML='<p>Belum ada bookmark.</p>';return}
 try{
  const result=await api('/manga?limit=100&ids[]='+saved.join('&ids[]=')+'&includes[]=cover_art');
  el.innerHTML='<div class="grid">'+result.data.map(card).join('')+'</div>';
 }catch(e){el.innerHTML='<p>'+escapeHtml(e.message)+'</p>'}
}


let catalogObserver=null;
let chapterObserver=null;

if('IntersectionObserver' in window){
 catalogObserver=new IntersectionObserver(entries=>{
  if(entries.some(x=>x.isIntersecting) &&
     document.getElementById('home').classList.contains('active') &&
     document.getElementById('catalogSentinel').dataset.done!=='yes'){
   loadManga(true);
  }
 },{rootMargin:'500px'});

 chapterObserver=new IntersectionObserver(entries=>{
  if(entries.some(x=>x.isIntersecting) &&
     document.getElementById('details').classList.contains('active') &&
     currentManga){
   loadChapters(currentManga,true);
  }
 },{rootMargin:'500px'});
}else{
 window.addEventListener('scroll',()=>{
  if(window.innerHeight+window.scrollY>=document.body.offsetHeight-500){
   if(document.getElementById('home').classList.contains('active')) loadManga(true);
   if(document.getElementById('details').classList.contains('active') && currentManga) loadChapters(currentManga,true);
  }
 });
}

search();
</script>
</body>
</html>
